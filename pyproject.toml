[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcockpit"
version = "0.1.0"
description = "Local-first AI-assisted job application workstation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "beautifulsoup4>=4.12.3",
    "certifi>=2025.1.31",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.180.0",
    "google-auth-oauthlib>=1.2.2",
    "httpx>=0.27.2",
    "playwright>=1.52.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "pypdf>=6.12.2",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "reportlab>=4.5.1",
    "sqlalchemy>=2.0.35",
    "tzdata>=2026.3",
    "uvicorn>=0.30.6",
]

[project.scripts]
jobcockpit = "jobcockpit.cli:main"

[project.optional-dependencies]
invisible-browser = [
    "invisible-playwright==0.20.0",
]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["jobcockpit*"]

[tool.setuptools.package-data]
"jobcockpit.ingestion" = ["capability_ontology.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "apps/api"]
markers = [
    "slow: slower end-to-end or integration-style tests",
    "integration: tests that exercise multiple app layers",
]

[tool.ruff]
line-length = 100
