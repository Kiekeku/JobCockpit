schema_version: 1
technologies:
  - canonical_name: Python
    entity_type: language
    patterns: ['\bpython\b']
    domains: [software, data]
  - canonical_name: TypeScript
    entity_type: language
    patterns: ['\btypescript\b']
    domains: [software]
  - canonical_name: JavaScript
    entity_type: language
    patterns: ['\bjavascript\b']
    domains: [software]
  - canonical_name: Java
    entity_type: language
    patterns: ['\bjava\b']
    domains: [software]
  - canonical_name: C#
    entity_type: language
    patterns: ['(?<!\w)c#(?!\w)']
    domains: [software]
  - canonical_name: C++
    entity_type: language
    patterns: ['(?<!\w)c\+\+(?!\w)']
    domains: [software, hardware_engineering]
  - canonical_name: Go
    entity_type: language
    patterns: ['(?<![-\w])go(?![-\w])']
    non_technology_patterns:
      - '\bgo(?:[-\s]+to[-\s]+market)\b'
      - '\bgo\s*/\s*no[-\s]+go\b'
      - '\bgo[-\s]+forward\b'
    domains: [software]
    requires_context: true
  - canonical_name: Rust
    entity_type: language
    patterns: ['\brust\b']
    non_technology_patterns:
      - '\brust(?:[-\s]+(?:control|inhibitors?|prevention|proofing|removal|resistance|resistant))\b'
    domains: [software]
    requires_context: true
  - canonical_name: R
    entity_type: language
    patterns: ['(?<![A-Za-z0-9&])R(?![A-Za-z0-9&])']
    domains: [data, research]
    requires_context: true
