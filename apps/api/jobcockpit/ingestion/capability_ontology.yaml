      - '\b(?:conical|erlenmeyer|round[-\s]+bottom|volumetric)\s+flask\b'
    domains: [software]
    requires_context: true
  - canonical_name: Spring
    entity_type: framework
    patterns: ['\bspring(?:\s+boot)?\b']
    non_technology_patterns:
      - '\bspring(?:[-\s]+(?:loaded|mechanisms?))\b'
      - '(?-i:\bspring\b)[-\s]+design\b'
      - '(?-i:\bspring\b)[-\s]+(?:fatigue(?:[-\s]+testing)?|selection)\b'
      - '\bspring[-\s]+(?:assembl(?:y|ies)|coils?|compression|constants?|forces?|rates?|stiffness|tension)\b'
      - '\b(?:coil|compression|extension|gas|helical|leaf|torsion)\s+spring\b'
    domains: [software]
    requires_context: true
    context_free_patterns: ['\bspring\s+boot\b']
