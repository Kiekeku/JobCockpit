  - canonical_name: Excel
    entity_type: tool
    include_in_tech_stack: false
    patterns:
      - '\bmicrosoft\s+excel\b'
      - '\bexcel\b'
    non_technology_patterns:
      - '\b(?:abilities|ability|aptitude|capabilities|capability|competence|competencies|competency|expertise|skills?|talents?)\b[^.;:\n]{0,40}\bto\s+excel\b'
    context_free_patterns: ['\bmicrosoft\s+excel\b']
    capability_context_patterns:
      - '\bdata\s+analysis\s*\([^)]*\bexcel\b'
      - '\bdata\s+tools?\s*\([^)]*\bexcel\b'
      - '\b(?:microsoft|ms)\s+office(?:\s+(?:applications?|skills?|suite))?\s*\([^)]*\bexcel\b'
      - '\b(?:spreadsheet\s+management|project\s+management\s+tools?)\b[^.;\n]{0,80}\bexcel\b'
      - '\b(?:proficien(?:cy|t)|skills?|knowledge|experience)\b[^.;:\n]{0,80}\b(?:including|such\s+as)\b[^.;:\n]{0,40}\bexcel\b'
      - '\b(?:competence|experience|familiarity|knowledge|proficien(?:cy|t))\b[^.;:\n]{0,100}\bexcel\b'
      - '\bexperienced\b[^.;:\n]{0,100}\bexcel\b'
      - '\boffice\s+tools?\s*:[^.;\n]{0,80}\bexcel\b'
      - '\b(?:microsoft|ms)\s+office(?:\s+(?:applications?|skills?|suite))?\b[^.;\n]{0,100}\bexcel\b'
      - '\b(?:data\s+tools?|software\s+programs?)\b[^.;\n]{0,100}\bexcel\b'
      - '\bexcel\s*/\s*csv\s+files?\b'
      - '\b(?:advanced|strong)\s+excel\b'
      - '\bexcel[-\s]+based\b'
      - '\bexcel\s*\([^)]*\b(?:formulas?|macros?|pivot|vlookup)\b'
      - '\bexcel\s+(?:analysis\s+tools?|dashboards?|models?|reports?|templates?)\b'
      - '\b(?:analysis|forecasts?|models?|reports?|spreadsheets?|workbooks?)\s+(?:in|using|with)\s+excel\b'
      - '\b(?:exports?|exported|exporting|saves?|saved|saving)\s+(?:(?:a|an|the|our|your)\s+)?(?:[a-z][\w''-]*\s+){0,3}(?:analys(?:is|es)|charts?|data|documents?|files?|forecasts?|models?|reports?|results?|spreadsheets?|tables?|workbooks?)\s+(?:to|as)\s+excel\b'
      - '\b(?:writes?|wrote|written|writing)\s+(?:(?:a|an|the|our|your)\s+)?(?:[a-z][\w''-]*\s+){0,3}(?:analys(?:is|es)|charts?|data|documents?|files?|forecasts?|models?|reports?|results?|spreadsheets?|tables?|workbooks?)\s+as\s+excel\b'
      - '\b(?:writes?|wrote|written|writing)\s+(?:(?:a|an|the|our|your)\s+)?(?:[a-z][\w''-]*\s+){0,3}(?:analys(?:is|es)|charts?|data|documents?|files?|forecasts?|models?|reports?|results?|spreadsheets?|tables?|workbooks?)\s+to\s+excel\b(?!\s+(?:at|in)\s+(?:(?:a|an|the|this|that|your|our)\s+)?(?:assignment|career|job|position|profession|role|work)\b|\s+[a-z][\w''-]*ly\b)'
      - '\b(?:exports?|exported|exporting|saves?|saved|saving)\s+(?:to|as)\s+excel\b'
    domains: [finance, operations, general_business]
    requires_context: true
