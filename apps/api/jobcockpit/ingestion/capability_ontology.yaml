      - '\bangular[-\s]+contact(?:[-\s]+bearings?)?\b'
    domains: [software]
    requires_context: true
  - canonical_name: Next.js
    entity_type: framework
    patterns: ['\bnext\.js\b']
    domains: [software]
  - canonical_name: Node.js
    entity_type: platform
    patterns: ['\bnode\.js\b']
